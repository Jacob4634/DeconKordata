name: Build DeconKordata

on:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: windows-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name DeconKordata src/decon_v3.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: DeconKordata
          path: dist/DeconKordata.exe
